[workspace]
resolver = "2"
members = [
    "crates/zedb-acp",
    "crates/zedb-core",
    "crates/zedb-ch",
    "crates/zedb-cli",
    "crates/zedb-app",
]

[workspace.package]
version = "0.1.33"
edition = "2021"
# Source-available, noncommercial; see LICENSE. Vendored crates keep their
# own (Apache-2.0) licenses.
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/rhodri-richards/zedb"

[workspace.dependencies]
zedb-core = { path = "crates/zedb-core" }
zedb-ch = { path = "crates/zedb-ch" }
zedb-acp = { path = "crates/zedb-acp" }
gpui = "0.2.2"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "zstd"] }
futures-util = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[patch.crates-io]
# Vendored crates with local patches; the catalog with locations and
# rationale is docs/contracts/VENDOR-PATCHES.md. gpui 0.2.2 carries the
# upstream deadlock fix for window_did_change_key_status (zed#51035)
# that has no crates.io release yet.
gpui = { path = "vendor/gpui" }
gpui-component = { path = "vendor/gpui-component" }

[profile.dev]
# gpui is heavy; keep dependency codegen optimized so the dev app stays usable.
[profile.dev.package."*"]
opt-level = 2
