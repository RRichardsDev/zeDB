# Example CI for a zedb migration repo (Phase 1 M9). Copy into the
# migration repo's .github/workflows/. Replaces the ancestor tooling's
# regen + check gates: every PR must keep current-state derived and the
# chain valid against the pinned server version.
name: migrations
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install zedb
        run: cargo install --git https://github.com/RRichardsDev/zeDB zedb-cli
      - name: Pin ClickHouse
        # Downloads the version from zedb.toml [engine] into the cache.
        run: zedb pin
      - name: current-state is derived
        run: zedb regen --check
      - name: checks
        run: zedb check --json
