name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-app:
    name: Package zeDB.app (macOS)
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # bundle script derives the build number from history
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Metal toolchain
        run: |
          if ! xcrun -f metal >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Import Developer ID certificate
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain=$RUNNER_TEMP/release.keychain-db
          keychain_password=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          identity=$(security find-identity -v -p codesigning "$keychain" |
            awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "ZEDB_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "ZEDB_HARDENED_RUNTIME=1" >> "$GITHUB_ENV"

      - name: Build bundle
        run: ./scripts/bundle-macos.sh

      - name: Notarize and staple
        if: ${{ env.HAS_NOTARY == 'true' && env.ZEDB_CODESIGN_IDENTITY != '' }}
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          ditto -c -k --keepParent target/macos/zeDB.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple target/macos/zeDB.app

      - name: Zip bundle
        id: zip
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          zip_name=zeDB-$version-macos.zip
          ditto -c -k --keepParent target/macos/zeDB.app "$zip_name"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        id: dmg
        run: |
          command -v create-dmg >/dev/null 2>&1 || brew install create-dmg
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          dmg_name=zeDB-$version-macos.dmg
          ./scripts/make-dmg.sh "$dmg_name"
          echo "dmg_name=$dmg_name" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple DMG
        if: ${{ env.HAS_NOTARY == 'true' && env.ZEDB_CODESIGN_IDENTITY != '' }}
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          xcrun notarytool submit "${{ steps.dmg.outputs.dmg_name }}" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple "${{ steps.dmg.outputs.dmg_name }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeDB-macos
          path: |
            ${{ steps.zip.outputs.zip_name }}
            ${{ steps.dmg.outputs.dmg_name }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag's CHANGELOG section becomes the release notes. The
          # changelog is hard-wrapped for editors, but GitHub renders
          # every newline in a release body as a line break, so joined
          # lines are unwrapped into one line per bullet or paragraph.
          changelog=$(awk -v tag="$GITHUB_REF_NAME" '
            /^## /{p = ($2 == tag)} p && !/^## /{print}
          ' CHANGELOG.md | awk '
            function flush() { if (length(buf)) print buf; buf = "" }
            /^$/   { flush(); print; next }
            /^#/   { flush(); print; next }
            /^- /  { flush(); buf = $0; next }
                   { line = $0; sub(/^[ \t]+/, "", line);
                     if (length(buf)) buf = buf " " line; else buf = line; next }
            END    { flush() }
          ')
          notes="macOS app bundle (DMG or zip)."
          if [[ -z "${ZEDB_CODESIGN_IDENTITY:-}" ]]; then
            notes="$notes Ad-hoc signed: Gatekeeper will block it on other machines until Developer ID signing secrets are configured."
          fi
          if [[ -n "$changelog" ]]; then
            notes="$(printf '%s\n\n---\n%s' "$changelog" "$notes")"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "zeDB $GITHUB_REF_NAME" \
            --notes "$notes" \
            "${{ steps.zip.outputs.zip_name }}" \
            "${{ steps.dmg.outputs.dmg_name }}" ||
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.zip.outputs.zip_name }}" \
            "${{ steps.dmg.outputs.dmg_name }}" --clobber
