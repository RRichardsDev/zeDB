name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  dependencies:
    name: Dependencies (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject vulnerable dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          command-arguments: --warn unmaintained

  core:
    name: Core (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache reviewed ClickHouse build (integration tests)
        run: |
          cp -R crates/zedb-core/tests/fixtures/demo-repo "$RUNNER_TEMP/pin-repo"
          cargo run -p zedb-cli -- --repo "$RUNNER_TEMP/pin-repo" pin --version 26.3.12.3
          binary="$HOME/.cache/zedb/clickhouse/26.3.12.3/clickhouse"
          test -x "$binary"
          echo "ZEDB_CLICKHOUSE_BIN=$binary" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p zedb-core -p zedb-ch -p zedb-cli --all-targets -- -D warnings
      - name: Test
        run: |
          cargo test -p zedb-core -p zedb-cli
          # zedb-ch's integration tests each stand up their own ephemeral
          # ClickHouse and interfere with each other when run concurrently:
          # a test reads state from a server it never wrote to. Serial is
          # green, parallel fails intermittently. See docs/devlog.md.
          cargo test -p zedb-ch -- --test-threads=1

  app:
    name: App (macOS gpui build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with the release workflow so tag builds reuse the
          # dependency cache CI populates on main.
          shared-key: zedb-macos
      - name: Install Metal toolchain
        run: |
          if ! xcrun -f metal >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Clippy
        run: cargo clippy -p zedb-app --all-targets -- -D warnings
      - name: Build
        run: cargo build -p zedb-app
