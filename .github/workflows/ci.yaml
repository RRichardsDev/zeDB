name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  core:
    name: Core (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ClickHouse (integration tests)
        run: |
          if ! command -v clickhouse >/dev/null 2>&1; then
            curl -fsSL https://clickhouse.com/ | sh
            sudo mv ./clickhouse /usr/local/bin/clickhouse
          fi
          clickhouse --version
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p zedb-core -p zedb-ch --all-targets -- -D warnings
      - name: Test
        run: cargo test -p zedb-core -p zedb-ch

  app:
    name: App (macOS gpui build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Metal toolchain
        run: |
          if ! xcrun -f metal >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Clippy
        run: cargo clippy -p zedb-app --all-targets -- -D warnings
      - name: Build
        run: cargo build -p zedb-app
