[package]
name = "zedb-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "zedb"
path = "src/main.rs"

[dependencies]
zedb-core.workspace = true
zedb-ch.workspace = true
zedb-acp.workspace = true
gpui.workspace = true
gpui-component = { version = "0.5.1", features = ["tree-sitter-languages"] }
dirs = "6"
log = "0.4"
modalkit = "0.0.25"
reqwest.workspace = true
chrono.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { workspace = true, features = ["net"] }
unicode-segmentation = "1"
anyhow = "1"
lsp-types = "0.97"
tempfile = "3"

[dev-dependencies]
# Headless windows, simulated input, and the deterministic executor
# for #[gpui::test] window tests.
gpui = { workspace = true, features = ["test-support"] }
